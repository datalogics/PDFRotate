[flake8]
# Note: Excluding .git, build directories, directories with unfixed Python
# files, and directories with NO Python files, to reduce time flake8 spends
# scanning.
#
# cmake-* catches build directories made by CLion
exclude = .git,.tox,cmake-*,*_build,*_debug,Installers,.idea,.conan2,python-env-*,.mkenv,.cache
select = E,W,F
max-line-length = 120
