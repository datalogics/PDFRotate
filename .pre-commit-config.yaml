exclude: ^\.idea/.*$
repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0
        hooks:
            -   id: trailing-whitespace
                args: [ --markdown-linebreak-ext=md ]
            -   id: end-of-file-fixer
            -   id: check-yaml
            -   id: check-added-large-files
            -   id: double-quote-string-fixer
    -   repo: https://github.com/PyCQA/flake8
        rev: 5.0.4
        hooks:
            -   id: flake8
    -   repo: https://github.com/pycqa/isort
        rev: 5.11.5
        hooks:
            -   id: isort
                name: isort (python)
    -   repo: git@github.com:datalogics/dl-pre-commit-hooks.git
        rev: 1.1.0
        hooks:
            -   id: convert-tabs-to-spaces
                alias: convert-tabs-to-4-spaces
                name: Convert tabs to 4 spaces in selected C/C++ sources
                args: [ '--tabsize=4' ]
                types_or:
                    - c
                    - c++
            -   id: apdfl-clang-format
                types_or:
                    - c
                    - c++
                exclude_types:
                    - objective-c
                    - objective-c++
